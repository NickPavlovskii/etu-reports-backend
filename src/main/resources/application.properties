spring.application.name=etu-reports-backend
server.port=${PORT:8081}

# PostgreSQL (Render / Neon: DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/reports_db}
spring.datasource.username=${DATABASE_USERNAME:niklad}
spring.datasource.password=${DATABASE_PASSWORD:Niklad}
spring.datasource.driver-class-name=org.postgresql.Driver

# Multipart (загрузка файлов)
spring.servlet.multipart.max-file-size=50MB
# Суммарный размер тела (для /api/validate/batch — несколько файлов за один запрос)
spring.servlet.multipart.max-request-size=256MB

# App config
reports.storage.dir=reports_storage

cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/v3/api-docs

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging (DEBUG для отладки запросов)
logging.level.com.etu.reports=DEBUG
logging.level.org.springframework.jdbc=WARN
