spring.application.name=etu-reports-backend
server.port=8081

# PostgreSQL (можно переопределить через env: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD)
spring.datasource.url=jdbc:postgresql://localhost:5432/reports_db
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:niklad}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Niklad}
spring.datasource.driver-class-name=org.postgresql.Driver

# Multipart (загрузка файлов)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# App config
reports.storage.dir=reports_storage
app.cors-allowed-origins=http://localhost:5173

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/v3/api-docs

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging (DEBUG для отладки запросов)
logging.level.com.etu.reports=DEBUG
logging.level.org.springframework.jdbc=WARN
